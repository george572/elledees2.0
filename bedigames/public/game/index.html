<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Spin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #0a0e1a;
      --bg-mid: #121a2e;
      --gold: #f0c14b;
      --gold-bright: #ffe08a;
      --gold-dark: #b8860b;
      --cream: #fff8e7;
      --panel: #151c2e;
      --reel-bg: #0b1020;
      --win: #5dff9a;
      --line: #4cc9f0;
      --near: #ff6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse 90% 55% at 50% 0%, #1a2744 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 100%, #2a1520 0%, transparent 50%),
        linear-gradient(165deg, var(--bg-deep), var(--bg-mid) 50%, #080c16 100%);
      overflow-x: hidden;
      padding: 1rem 0.75rem 2rem;
    }

    .scene {
      width: min(720px, 100%);
      animation: enter 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }

    .brand { text-align: center; margin-bottom: 1rem; }

    .brand h1 {
      font-family: "Bungee", cursive;
      font-size: clamp(1.9rem, 6vw, 2.6rem);
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, var(--gold-bright), var(--gold) 50%, var(--gold-dark));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 3px 0 #4a3200) drop-shadow(0 0 18px rgba(240, 193, 75, 0.3));
      line-height: 1.1;
    }

    .brand p {
      margin-top: 0.3rem;
      font-size: 0.8rem;
      opacity: 0.55;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .machine {
      background: linear-gradient(180deg, #1e2740 0%, var(--panel) 35%, #0e1424 100%);
      border: 3px solid var(--gold-dark);
      border-radius: 22px;
      padding: 1rem 0.9rem 1.25rem;
      box-shadow:
        0 0 0 2px #5a4208,
        0 22px 50px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .stat {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(240, 193, 75, 0.22);
      border-radius: 10px;
      padding: 0.45rem 0.5rem;
      text-align: center;
    }

    .stat label {
      display: block;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .stat span {
      font-family: "Bungee", cursive;
      font-size: clamp(0.95rem, 3vw, 1.15rem);
      color: var(--gold);
    }

    .screen {
      position: relative;
      background: #060a14;
      border: 3px solid var(--gold);
      border-radius: 14px;
      padding: 0.55rem;
      box-shadow:
        inset 0 0 40px rgba(0, 0, 0, 0.65),
        0 0 28px rgba(240, 193, 75, 0.12);
      overflow: hidden;
    }

    .line-picker {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      place-items: center;
      padding: 0.75rem;
      background: rgba(4, 8, 18, 0.82);
      backdrop-filter: blur(6px);
      animation: pickerIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .line-picker.open { display: grid; }

    .line-picker-panel {
      width: min(100%, 520px);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.45rem;
    }

    @media (min-width: 520px) {
      .line-picker-panel { grid-template-columns: repeat(4, 1fr); }
    }

    .line-picker-title {
      grid-column: 1 / -1;
      text-align: center;
      font-family: "Bungee", cursive;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      color: var(--gold-bright);
      letter-spacing: 0.06em;
    }

    .line-picker-hint {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 0.72rem;
      opacity: 0.55;
      margin-bottom: 0.15rem;
    }

    @keyframes pickerIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: none; }
    }

    .line-btn {
      appearance: none;
      border: 1px solid rgba(240, 193, 75, 0.22);
      background: rgba(12, 18, 32, 0.92);
      border-radius: 12px;
      padding: 0.5rem 0.4rem 0.45rem;
      cursor: pointer;
      color: var(--cream);
      text-align: center;
      transition: border-color 0.15s, background 0.15s, transform 0.12s;
    }

    .line-btn:hover:not(:disabled) {
      border-color: rgba(76, 201, 240, 0.65);
      transform: translateY(-1px);
    }

    .line-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .line-btn.selected {
      border-color: var(--line);
      background: rgba(76, 201, 240, 0.14);
      box-shadow: 0 0 14px rgba(76, 201, 240, 0.25);
    }

    .line-btn svg { display: block; width: 100%; height: 26px; }

    .line-btn .line-name {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .line-btn .line-pay {
      display: block;
      margin-top: 0.28rem;
      font-family: "Bungee", cursive;
      font-size: clamp(0.78rem, 2.4vw, 0.95rem);
      color: var(--gold-bright);
      line-height: 1.2;
    }

    .line-btn .line-pay-sub {
      display: block;
      font-family: "Nunito", system-ui, sans-serif;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: rgba(255, 224, 138, 0.55);
      text-transform: uppercase;
    }

    .reels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.35rem;
      position: relative;
      z-index: 1;
    }

    .reel {
      background: var(--reel-bg);
      border-radius: 8px;
      height: calc(3 * var(--cell, 80px));
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      --cell: 80px;
      transition: box-shadow 0.25s, filter 0.25s, opacity 0.25s;
    }

    .reel.bg-spin {
      filter: blur(1.5px) brightness(0.72);
      opacity: 0.72;
    }

    .reel.active-spin {
      filter: brightness(1.12);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        0 0 0 2px rgba(240, 193, 75, 0.45),
        0 0 18px rgba(240, 193, 75, 0.2);
      z-index: 2;
    }

    .reel.locked {
      filter: brightness(1.08);
      opacity: 1;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 0 20px rgba(93, 255, 154, 0.12);
    }

    .reel-window { position: absolute; inset: 0; overflow: hidden; }

    .reel-strip {
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    .cell {
      height: var(--cell, 80px);
      min-height: var(--cell, 80px);
      max-height: var(--cell, 80px);
      display: grid;
      place-items: center;
      font-size: calc(var(--cell, 80px) * 0.42);
      line-height: 1;
      flex: 0 0 var(--cell, 80px);
      overflow: hidden;
      user-select: none;
      position: relative;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.4));
    }

    .cell.win-glow {
      background: radial-gradient(circle, rgba(93, 255, 154, 0.28), transparent 70%);
      transform: scale(1.08);
      animation: winPulse 0.55s ease infinite alternate;
    }

    @keyframes winPulse {
      from { filter: drop-shadow(0 0 4px rgba(93, 255, 154, 0.4)); }
      to { filter: drop-shadow(0 0 14px rgba(93, 255, 154, 0.9)); }
    }

    .stop-frame {
      position: absolute;
      border: 3px solid var(--gold-bright);
      border-radius: 10px;
      pointer-events: none;
      z-index: 5;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.5),
        0 0 18px rgba(240, 193, 75, 0.55),
        inset 0 0 16px rgba(255, 224, 138, 0.12);
      opacity: 0;
      transform: scale(0.92);
      transition: left 0.22s cubic-bezier(0.22, 1, 0.36, 1), top 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s, transform 0.2s;
    }

    .stop-frame.visible {
      opacity: 1;
      transform: scale(1);
      animation: framePulse 0.9s ease-in-out infinite;
    }

    @keyframes framePulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 0 14px rgba(240, 193, 75, 0.45), inset 0 0 16px rgba(255, 224, 138, 0.1); }
      50% { box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 0 26px rgba(255, 224, 138, 0.75), inset 0 0 18px rgba(255, 224, 138, 0.18); }
    }

    .line-overlay {
      position: absolute;
      inset: 0.55rem;
      pointer-events: none;
      z-index: 3;
      opacity: 0.85;
    }

    .line-overlay svg { width: 100%; height: 100%; }

    .message {
      text-align: center;
      min-height: 1.5rem;
      margin: 0.85rem 0 0.7rem;
      font-weight: 800;
      font-size: clamp(0.95rem, 2.8vw, 1.1rem);
      color: var(--gold-bright);
    }

    .message.win { color: var(--win); animation: msgPulse 0.45s ease; }
    .message.lose { color: #ff9aa8; }
    .message.near { color: var(--near); animation: msgPulse 0.45s ease; }

    @keyframes msgPulse { 50% { transform: scale(1.06); } }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.75rem 1rem;
    }

    .bet-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .bet-row button {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      border: 2px solid var(--gold-dark);
      background: linear-gradient(180deg, #3a4458, #252b38);
      color: var(--gold);
      font-family: "Bungee", cursive;
      font-size: 1.05rem;
      cursor: pointer;
    }

    .bet-row button:disabled { opacity: 0.4; cursor: not-allowed; }

    .bet-meta { text-align: center; }
    .bet-label {
      font-size: 0.65rem;
      opacity: 0.55;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .bet-value {
      font-family: "Bungee", cursive;
      color: var(--gold);
      min-width: 2rem;
    }

    .spin-btn {
      min-width: 180px;
      padding: 0.85rem 1.6rem;
      border: none;
      border-radius: 999px;
      font-family: "Bungee", cursive;
      font-size: 1.25rem;
      letter-spacing: 0.08em;
      color: #1a1200;
      cursor: pointer;
      background: linear-gradient(180deg, #ffe08a, var(--gold) 45%, #c99520);
      box-shadow: 0 5px 0 #8a6508, 0 10px 22px rgba(0, 0, 0, 0.35);
    }

    .spin-btn.lock-mode {
      background: linear-gradient(180deg, #9bffc4, #5dff9a 45%, #2bb86a);
      box-shadow: 0 5px 0 #1a7a45, 0 10px 22px rgba(0, 0, 0, 0.35);
      color: #062214;
    }

    .spin-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(0.25);
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 50;
    }

    .confetti i {
      position: absolute;
      top: -12px;
      width: 8px;
      height: 12px;
      border-radius: 2px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    .machine.win-flash .screen {
      animation: screenGlow 0.55s ease 3;
    }

    @keyframes screenGlow {
      50% { box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.65), 0 0 36px rgba(93, 255, 154, 0.45); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <header class="brand">
      <h1>Lucky Spin</h1>
      <p>Time the stop · watch it slip</p>
    </header>

    <div class="machine" id="machine">
      <div class="hud">
        <div class="stat">
          <label>Credits</label>
          <span id="credits">1000</span>
        </div>
        <div class="stat">
          <label>Bet</label>
          <span id="betDisplay">10</span>
        </div>
        <div class="stat">
          <label>Win</label>
          <span id="lastWin">0</span>
        </div>
      </div>

      <div class="screen" id="screen">
        <div class="reels" id="reels"></div>
        <div class="line-overlay">
          <svg id="chosenLineSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        </div>
        <div class="stop-frame" id="stopFrame" aria-hidden="true"></div>
        <div class="line-picker" id="linePicker">
          <div class="line-picker-panel" id="linePickerPanel">
            <div class="line-picker-title">Choose your line</div>
            <div class="line-picker-hint">Harder lines pay more · GEL</div>
          </div>
        </div>
      </div>

      <p class="message" id="message">Press SPIN or Space to play</p>

      <div class="controls">
        <div class="bet-row">
          <button type="button" id="betDown" aria-label="Decrease bet">−</button>
          <div class="bet-meta">
            <div class="bet-label">Total bet</div>
            <div class="bet-value" id="bet">10</div>
          </div>
          <button type="button" id="betUp" aria-label="Increase bet">+</button>
        </div>
        <button type="button" class="spin-btn" id="spinBtn">SPIN</button>
      </div>
    </div>
  </div>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script>
    const COLS = 5;
    const ROWS = 3;
    const LOOP_LEN = 40;
    const SYMBOLS = ["🍒", "🍋", "🍉", "🔔", "⭐", "💎", "7️⃣"];
    const WEIGHTS = [28, 26, 20, 14, 8, 5, 3];
    const SPEED_BG = 16;
    const SPEED_ACTIVE = 8.4;
    const SETTLE_KEEP_MS = 380;
    const SETTLE_MISS_MS = 980;
    /** Tiny window — perfect should be rare and hard, not free. */
    const PERFECT_WINDOW = 0.022;

    const PAY = {
      "🍒": { 3: 2, 4: 5, 5: 10 },
      "🍋": { 3: 2, 4: 6, 5: 12 },
      "🍉": { 3: 3, 4: 8, 5: 15 },
      "🔔": { 3: 4, 4: 10, 5: 20 },
      "⭐": { 3: 5, 4: 12, 5: 25 },
      "💎": { 3: 8, 4: 20, 5: 40 },
      "7️⃣": { 3: 10, 4: 25, 5: 50 },
    };

    const LINE_CHOICES = [
      { id: "mid", name: "Mid", line: [1, 1, 1, 1, 1], lineMult: 1 },
      { id: "top", name: "Top", line: [0, 0, 0, 0, 0], lineMult: 1.2 },
      { id: "bot", name: "Bottom", line: [2, 2, 2, 2, 2], lineMult: 1.2 },
      { id: "v", name: "V", line: [0, 1, 2, 1, 0], lineMult: 1.5 },
      { id: "caret", name: "Peak", line: [2, 1, 0, 1, 2], lineMult: 1.5 },
      { id: "diag1", name: "Slide", line: [0, 0, 1, 2, 2], lineMult: 1.8 },
      { id: "diag2", name: "Climb", line: [2, 2, 1, 0, 0], lineMult: 1.8 },
      { id: "zig", name: "Zigzag", line: [1, 0, 1, 2, 1], lineMult: 2.2 },
    ];

    let credits = 1000;
    let bet = 10;
    let phase = "idle"; // idle | pickingLine | playing | settling
    let activeReel = 0;
    let locking = false;
    let selectedLineId = "mid";
    let chaseSymbol = null; // set after reel 1 locks
    let grid = [];
    let rafId = 0;
    let lastTs = 0;
    let lastTickSound = 0;

    const reels = Array.from({ length: COLS }, () => ({
      offset: 0,
      locked: false,
      settling: false,
      coast: null, // { from, target, start, duration, meta }
      symbols: [],
    }));

    const creditsEl = document.getElementById("credits");
    const betEl = document.getElementById("bet");
    const betDisplay = document.getElementById("betDisplay");
    const lastWinEl = document.getElementById("lastWin");
    const messageEl = document.getElementById("message");
    const spinBtn = document.getElementById("spinBtn");
    const betUp = document.getElementById("betUp");
    const betDown = document.getElementById("betDown");
    const machine = document.getElementById("machine");
    const reelsRoot = document.getElementById("reels");
    const stopFrame = document.getElementById("stopFrame");
    const linePicker = document.getElementById("linePicker");
    const linePickerPanel = document.getElementById("linePickerPanel");
    const chosenLineSvg = document.getElementById("chosenLineSvg");

    const reelEls = [];
    const stripEls = [];

    for (let c = 0; c < COLS; c++) {
      const reel = document.createElement("div");
      reel.className = "reel";
      const windowEl = document.createElement("div");
      windowEl.className = "reel-window";
      const strip = document.createElement("div");
      strip.className = "reel-strip";
      windowEl.appendChild(strip);
      reel.appendChild(windowEl);
      reelsRoot.appendChild(reel);
      reelEls.push(reel);
      stripEls.push(strip);
    }

    /** One size for CSS + scroll math — prevents blank gaps between symbols. */
    function syncCellSize() {
      const size = Math.round(Math.min(92, Math.max(64, window.innerWidth * 0.14)));
      document.querySelectorAll(".reel").forEach((el) => {
        el.style.setProperty("--cell", `${size}px`);
      });
      return size;
    }

    function cellH() {
      const raw = getComputedStyle(reelEls[0]).getPropertyValue("--cell");
      const parsed = parseFloat(raw);
      return parsed > 0 ? parsed : syncCellSize();
    }

    function loopPx() {
      return LOOP_LEN * cellH();
    }

    function normOffset(offset) {
      const lp = loopPx();
      let y = offset % lp;
      if (y < 0) y += lp;
      return y;
    }

    function snapIndex(offset) {
      const h = cellH();
      return Math.round(normOffset(offset) / h) % LOOP_LEN;
    }

    /** Animate transform without crossing the loop seam (avoids empty frames). */
    function visualY(fromAbs, toAbs) {
      const lp = loopPx();
      const fromY = normOffset(fromAbs);
      let toY = normOffset(toAbs);
      let delta = toY - fromY;
      if (delta > lp / 2) delta -= lp;
      if (delta < -lp / 2) delta += lp;
      return { fromY, toY: fromY + delta, finalAbs: toAbs };
    }

    function currentLine() {
      return LINE_CHOICES.find((l) => l.id === selectedLineId) || LINE_CHOICES[0];
    }

    function frameRow(col = activeReel) {
      return currentLine().line[col];
    }

    function formatGel(n) {
      return `₾${n}`;
    }

    // —— Line picker ——
    function miniLineSvg(line) {
      const pts = line
        .map((row, col) => `${((col + 0.5) / COLS) * 100},${((row + 0.5) / ROWS) * 100}`)
        .join(" ");
      return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#4cc9f0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }

    function lineBtnHtml(choice) {
      const low = Math.round(bet * 2 * choice.lineMult);
      const high = Math.round(bet * 50 * choice.lineMult);
      return `${miniLineSvg(choice.line)}<span class="line-name">${choice.name}</span><span class="line-pay">${formatGel(low)}–${formatGel(high)}<span class="line-pay-sub">GEL</span></span>`;
    }

    LINE_CHOICES.forEach((choice) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "line-btn" + (choice.id === selectedLineId ? " selected" : "");
      btn.dataset.lineId = choice.id;
      btn.innerHTML = lineBtnHtml(choice);
      btn.addEventListener("click", () => {
        if (phase !== "pickingLine") return;
        playClick();
        selectedLineId = choice.id;
        syncLineButtons();
        drawChosenLine(false);
        beginSpin();
      });
      linePickerPanel.appendChild(btn);
    });

    function refreshLinePayoutLabels() {
      document.querySelectorAll(".line-btn").forEach((el) => {
        const choice = LINE_CHOICES.find((l) => l.id === el.dataset.lineId);
        if (choice) el.innerHTML = lineBtnHtml(choice);
      });
      syncLineButtons();
    }

    function syncLineButtons() {
      document.querySelectorAll(".line-btn").forEach((el) => {
        el.classList.toggle("selected", el.dataset.lineId === selectedLineId);
      });
    }

    function showLinePicker(show) {
      if (show) refreshLinePayoutLabels();
      linePicker.classList.toggle("open", show);
    }

    function clearChosenLine() {
      chosenLineSvg.innerHTML = "";
    }

    function drawChosenLine(winMode = false) {
      const line = currentLine().line;
      const color = winMode ? "#5dff9a" : "#4cc9f0";
      const pts = line
        .map((row, col) => `${((col + 0.5) / COLS) * 100},${((row + 0.5) / ROWS) * 100}`)
        .join(" ");
      chosenLineSvg.innerHTML = `
        <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9" vector-effect="non-scaling-stroke"/>
        ${line.map((row, col) => {
          const x = ((col + 0.5) / COLS) * 100;
          const y = ((row + 0.5) / ROWS) * 100;
          return `<circle cx="${x}" cy="${y}" r="2.2" fill="${color}"/>`;
        }).join("")}`;
    }

    // —— Audio ——
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function tone(freq, dur, type = "square", gain = 0.07, when = 0) {
      const ctx = ensureAudio();
      const t = ctx.currentTime + when;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    function playClick() { tone(190, 0.04, "triangle", 0.05); }
    function playSpinStart() {
      tone(200, 0.07, "sawtooth", 0.04);
      tone(320, 0.09, "square", 0.035, 0.05);
    }
    function playTick() { tone(520 + Math.random() * 180, 0.02, "square", 0.014); }
    function playLock() {
      tone(260, 0.06, "triangle", 0.07);
      tone(420, 0.08, "square", 0.04, 0.04);
    }
    function playPerfect() {
      tone(523, 0.08, "triangle", 0.07);
      tone(784, 0.12, "sine", 0.06, 0.06);
      tone(1046, 0.14, "triangle", 0.05, 0.12);
    }
    function playWin(big) {
      const notes = big
        ? [523, 659, 784, 1046, 784, 1046, 1318]
        : [392, 523, 659, 784, 988];
      notes.forEach((n, i) => tone(n, 0.16, "triangle", 0.06, i * 0.09));
    }
    function playLose() {
      tone(200, 0.12, "sawtooth", 0.035);
      tone(150, 0.18, "triangle", 0.04, 0.1);
    }

    function pickSymbol() {
      const total = WEIGHTS.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < SYMBOLS.length; i++) {
        r -= WEIGHTS[i];
        if (r <= 0) return SYMBOLS[i];
      }
      return SYMBOLS[0];
    }

    function fillStrip(col, teaseSym = null) {
      syncCellSize();
      const symbols = [];
      for (let i = 0; i < LOOP_LEN; i++) {
        // Light tease only — dense chase made 5-of-a-kind too easy
        if (teaseSym && i % 5 === 2) symbols.push(teaseSym);
        else symbols.push(pickSymbol());
      }
      reels[col].symbols = symbols;
      const strip = stripEls[col];
      strip.style.transition = "none";
      // Render twice so scrolling never shows empty space at the loop seam
      const render = symbols.concat(symbols);
      strip.innerHTML = render.map((s) => `<div class="cell">${s}</div>`).join("");
    }

    function teaseRemainingReels(sym) {
      for (let c = 0; c < COLS; c++) {
        if (reels[c].locked || reels[c].settling) continue;
        const keep = reels[c].offset;
        fillStrip(c, sym);
        reels[c].offset = keep;
        applyTransform(c);
      }
    }

    function applyTransform(col) {
      if (reels[col].locked && reels[col].symbols.length === ROWS) {
        stripEls[col].style.transform = "translate3d(0,0,0)";
        return;
      }
      const reel = reels[col];
      // During coast, keep Y continuous (use doubled strip past the loop seam)
      if (reel.coast) {
        const base = normOffset(reel.coast.from);
        const delta = reel.offset - reel.coast.from;
        stripEls[col].style.transform = `translate3d(0, ${-(base + delta)}px, 0)`;
        return;
      }
      const y = normOffset(reel.offset);
      stripEls[col].style.transform = `translate3d(0, ${-y}px, 0)`;
    }

    function visibleSymbols(col) {
      if (reels[col].locked && reels[col].symbols.length === ROWS) {
        return reels[col].symbols.slice();
      }
      const start = snapIndex(reels[col].offset);
      return Array.from({ length: ROWS }, (_, r) =>
        reels[col].symbols[(start + r) % LOOP_LEN]
      );
    }

    function framedSymbol(col) {
      return visibleSymbols(col)[frameRow(col)];
    }

    function pinLockedReel(col, symbols) {
      syncCellSize();
      reels[col].symbols = symbols.slice();
      reels[col].offset = 0;
      reels[col].locked = true;
      reels[col].settling = false;
      reels[col].coast = null;
      const strip = stripEls[col];
      strip.style.transition = "none";
      strip.innerHTML = symbols.map((s) => `<div class="cell">${s}</div>`).join("");
      strip.style.transform = "translate3d(0,0,0)";
    }

    function updateFramePosition() {
      const h = cellH();
      const row = frameRow(activeReel);
      const screenRect = document.getElementById("screen").getBoundingClientRect();
      const reelRect = reelEls[activeReel].getBoundingClientRect();
      stopFrame.style.left = `${reelRect.left - screenRect.left}px`;
      stopFrame.style.top = `${reelRect.top - screenRect.top + row * h}px`;
      stopFrame.style.width = `${reelRect.width}px`;
      stopFrame.style.height = `${h}px`;
    }

    function showFrame(show) {
      stopFrame.classList.toggle("visible", show);
      if (show) updateFramePosition();
    }

    function setMessage(text, kind = "") {
      messageEl.textContent = text;
      messageEl.className = "message" + (kind ? " " + kind : "");
    }

    function updateUI() {
      creditsEl.textContent = credits;
      betEl.textContent = bet;
      betDisplay.textContent = bet;
      const busy = phase !== "idle";
      betUp.disabled = busy || bet >= Math.min(100, credits);
      betDown.disabled = busy || bet <= 5;
      document.querySelectorAll(".line-btn").forEach((el) => {
        el.disabled = phase !== "pickingLine";
      });

      spinBtn.classList.remove("lock-mode");
      if (phase === "playing") {
        spinBtn.textContent = "STOP";
        spinBtn.classList.add("lock-mode");
        spinBtn.disabled = locking;
      } else if (phase === "pickingLine") {
        spinBtn.textContent = "PICK";
        spinBtn.disabled = true;
      } else if (phase === "settling") {
        spinBtn.textContent = "…";
        spinBtn.disabled = true;
      } else {
        spinBtn.textContent = "SPIN";
        spinBtn.disabled = credits < bet;
      }
    }

    function syncReelClasses() {
      for (let c = 0; c < COLS; c++) {
        const el = reelEls[c];
        el.classList.toggle("locked", reels[c].locked);
        el.classList.toggle("active-spin", phase === "playing" && c === activeReel && !reels[c].locked && !reels[c].settling);
        el.classList.toggle("bg-spin", phase === "playing" && !reels[c].locked && c !== activeReel);
      }
    }

    function clearWinHighlights() {
      document.querySelectorAll(".cell.win-glow").forEach((el) => {
        el.classList.remove("win-glow");
      });
      machine.classList.remove("win-flash");
      drawChosenLine(false);
    }

    function evaluateChosenLine(g) {
      const choice = currentLine();
      const line = choice.line;
      const symbols = line.map((row, col) => g[col][row]);
      const first = symbols[0];
      let count = 1;
      for (let i = 1; i < symbols.length; i++) {
        if (symbols[i] === first) count++;
        else break;
      }
      if (count >= 3 && PAY[first]?.[count]) {
        return {
          total: Math.round(bet * PAY[first][count] * choice.lineMult),
          count,
          symbol: first,
          line,
          symbols,
        };
      }
      return { total: 0, count, symbol: first, line, symbols };
    }

    function highlightLineCells(line, count) {
      for (let col = 0; col < count; col++) {
        const cell = stripEls[col].children[line[col]];
        if (cell) cell.classList.add("win-glow");
      }
    }

    function burstConfetti() {
      const root = document.getElementById("confetti");
      const colors = ["#f0c14b", "#e63946", "#5dff9a", "#4cc9f0", "#f72585"];
      for (let i = 0; i < 48; i++) {
        const el = document.createElement("i");
        el.style.left = Math.random() * 100 + "%";
        el.style.background = colors[i % colors.length];
        el.style.animationDuration = 1.1 + Math.random() * 1.5 + "s";
        el.style.animationDelay = Math.random() * 0.25 + "s";
        root.appendChild(el);
        setTimeout(() => el.remove(), 2800);
      }
    }

    // Stays fast, then hard brake — reads as real reel momentum
    function easeOutQuint(t) {
      return 1 - Math.pow(1 - t, 5);
    }

    function tick(ts) {
      if (phase !== "playing") return;
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      const h = cellH();
      const lp = loopPx();
      let anySpinning = false;
      let finishedCoast = null;

      for (let c = 0; c < COLS; c++) {
        const reel = reels[c];
        if (reel.locked) continue;

        if (reel.coast) {
          const coast = reel.coast;
          if (coast.start == null) coast.start = ts;
          const t = Math.min(1, (ts - coast.start) / coast.duration);
          const eased = easeOutQuint(t);
          reel.offset = coast.from + (coast.target - coast.from) * eased;
          applyTransform(c);
          if (t >= 1) {
            reel.offset = coast.target;
            applyTransform(c);
            finishedCoast = { col: c, meta: coast.meta };
            reel.coast = null;
            reel.settling = false;
          }
          continue;
        }

        if (reel.settling) continue;

        anySpinning = true;
        const spd = c === activeReel ? SPEED_ACTIVE : SPEED_BG * (0.92 + (c % 3) * 0.06);
        reel.offset += spd * h * dt;
        if (reel.offset >= lp) reel.offset -= lp;
        if (reel.offset < 0) reel.offset += lp;
        applyTransform(c);
      }

      if (anySpinning && ts - lastTickSound > 85) {
        lastTickSound = ts;
        playTick();
      }

      if (finishedCoast) {
        completeLock(finishedCoast.col, finishedCoast.meta);
      }

      rafId = requestAnimationFrame(tick);
    }

    function promptLineChoice() {
      if (phase !== "idle" || credits < bet) return;
      ensureAudio();
      playClick();
      phase = "pickingLine";
      showLinePicker(true);
      syncLineButtons();
      drawChosenLine(false);
      setMessage("Choose the line you want to fill");
      updateUI();
    }

    function cancelPickers() {
      phase = "idle";
      showLinePicker(false);
      clearChosenLine();
      setMessage("Press SPIN or Space to play");
      updateUI();
    }

    function beginSpin() {
      if (phase !== "pickingLine") return;
      if (credits < bet) {
        cancelPickers();
        setMessage("Not enough credits", "lose");
        return;
      }

      showLinePicker(false);
      credits -= bet;
      lastWinEl.textContent = "0";
      chaseSymbol = null;
      clearWinHighlights();
      playSpinStart();

      activeReel = 0;
      locking = false;
      grid = [];
      syncCellSize();
      for (let c = 0; c < COLS; c++) {
        fillStrip(c);
        reels[c].locked = false;
        reels[c].settling = false;
        reels[c].coast = null;
        reels[c].offset = Math.random() * loopPx();
        reelEls[c].classList.remove("locked", "active-spin", "bg-spin");
        applyTransform(c);
      }

      phase = "playing";
      drawChosenLine(false);
      showFrame(true);
      syncReelClasses();
      setMessage("Reel 1 — Space to STOP · dead center = PERFECT");
      updateUI();
      lastTs = 0;
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(tick);
    }

    /**
     * PERFECT only freezes the framed symbol.
     * Everything else KEEPS ROLLING with spin momentum, then brakes:
     *   late (past center)  → almost always overshoots to the next symbol
     *   early (before center) → usually rolls through past it; rarely settles on it
     * Keep chance is low on purpose — you should feel near-misses, not farm lands.
     */
    function lockActiveReel() {
      if (phase !== "playing" || locking) return;

      const c = activeReel;
      const h = Math.max(cellH(), 1);
      const from = reels[c].offset;
      const y = normOffset(from);
      const cells = y / h;
      const aim = Math.round(cells);
      const frac = cells - aim; // <0 early / low, >0 late / drifted up
      const dist = Math.abs(frac);
      const perfect = dist <= PERFECT_WINDOW;
      const pressedSym = framedSymbol(c);
      const strip = stripEls[c];
      strip.style.transition = "none";

      locking = true;
      spinBtn.disabled = true;

      if (perfect) {
        reels[c].settling = true;
        syncReelClasses();
        reels[c].offset = from - y + aim * h;
        applyTransform(c);
        setMessage("PERFECT!");
        playPerfect();
        reels[c].settling = false;
        completeLock(c, { perfect: true, pressedSym, kept: true });
        return;
      }

      // Non-perfect keeps are rare — close early ~25%, late/sloppy ~5–12%
      const keepChance =
        frac < 0
          ? Math.max(0.08, 0.3 - dist * 0.6)
          : Math.max(0.05, 0.16 - dist * 0.75);
      const kept = Math.random() < keepChance;

      // Slip always continues in spin direction so the framed symbol rolls OUT
      // of the frame (classic near-miss). Keep only nudges onto aim.
      const landedIndex = kept ? aim : aim + 1;
      const target = from + (landedIndex - cells) * h;
      const duration = kept ? SETTLE_KEEP_MS : SETTLE_MISS_MS;

      reels[c].settling = true;
      reels[c].coast = {
        from,
        target,
        start: null,
        duration,
        meta: { perfect: false, pressedSym, kept },
      };
      syncReelClasses();
      setMessage(kept ? "Braking…" : "Momentum…");
      tone(160, 0.045, "sine", 0.035);
    }

    function completeLock(c, meta = { perfect: false, pressedSym: null, kept: false }) {
      reels[c].offset = normOffset(reels[c].offset);
      applyTransform(c);

      const lockedCol = visibleSymbols(c);
      grid[c] = lockedCol;
      pinLockedReel(c, lockedCol);
      reelEls[c].classList.remove("active-spin", "bg-spin");
      reelEls[c].classList.add("locked");

      const fr = frameRow(c);
      const sym = lockedCol[fr];

      if (c === 0) {
        chaseSymbol = sym;
        teaseRemainingReels(chaseSymbol);
      }

      if (meta.perfect) {
        playLock();
        setMessage(`PERFECT ${sym} on reel ${c + 1}!`, "win");
      } else if (meta.kept) {
        playLock();
        setMessage(`${sym} locked on reel ${c + 1}`);
      } else {
        playLock();
        setMessage(`${sym} on reel ${c + 1}`);
      }

      locking = false;

      if (c >= COLS - 1) {
        showFrame(false);
        setTimeout(finishRound, 280);
        return;
      }

      activeReel = c + 1;
      syncReelClasses();
      updateFramePosition();
      const delay = 320;
      setTimeout(() => {
        if (phase === "playing" && !locking) {
          const chase = chaseSymbol ? `Chase ${chaseSymbol} · ` : "";
          setMessage(`${chase}reel ${activeReel + 1} — Space to STOP`);
        }
      }, delay);
      updateUI();
    }

    function finishRound() {
      phase = "settling";
      cancelAnimationFrame(rafId);
      updateUI();

      const result = evaluateChosenLine(grid);

      if (result.total > 0) {
        credits += result.total;
        lastWinEl.textContent = formatGel(result.total);
        const big = result.total >= bet * 10;
        setMessage(
          `${result.count}× ${result.symbol} on ${currentLine().name}! +${formatGel(result.total)}`,
          "win"
        );
        drawChosenLine(true);
        highlightLineCells(result.line, result.count);
        playWin(big);
        machine.classList.add("win-flash");
        if (big) burstConfetti();
      } else {
        setMessage(`No ${currentLine().name} win — try again`, "lose");
        playLose();
      }

      if (credits < 5) {
        setMessage("Out of credits — refresh to restart", "lose");
      } else if (bet > credits) {
        bet = Math.max(5, Math.floor(credits / 5) * 5);
      }

      phase = "idle";
      showLinePicker(false);
      updateUI();
    }

    function onAction() {
      if (phase === "idle") promptLineChoice();
      else if (phase === "playing") lockActiveReel();
    }

    betUp.addEventListener("click", () => {
      if (phase !== "idle") return;
      playClick();
      bet = Math.min(100, credits, bet + 5);
      updateUI();
      refreshLinePayoutLabels();
    });

    betDown.addEventListener("click", () => {
      if (phase !== "idle") return;
      playClick();
      bet = Math.max(5, bet - 5);
      updateUI();
      refreshLinePayoutLabels();
    });

    spinBtn.addEventListener("click", onAction);

    document.addEventListener("keydown", (e) => {
      if (e.code === "Escape" && phase === "pickingLine") {
        e.preventDefault();
        cancelPickers();
        return;
      }
      if (e.code !== "Space" && e.key !== "Enter") return;
      e.preventDefault();
      if (phase === "playing") lockActiveReel();
      else if (phase === "idle") promptLineChoice();
      else if (phase === "pickingLine") beginSpin();
    });

    window.addEventListener("resize", () => {
      const prev = cellH();
      syncCellSize();
      const next = cellH();
      if (prev > 0 && next !== prev) {
        for (let c = 0; c < COLS; c++) {
          reels[c].offset = (reels[c].offset / prev) * next;
          if (!reels[c].locked) applyTransform(c);
        }
      }
      if (phase === "playing") updateFramePosition();
    });

    syncCellSize();
    for (let c = 0; c < COLS; c++) {
      fillStrip(c);
      reels[c].offset = Math.floor(Math.random() * (LOOP_LEN - ROWS)) * cellH();
      applyTransform(c);
    }
    clearChosenLine();
    showLinePicker(false);
    updateUI();
  </script>
</body>
</html>
